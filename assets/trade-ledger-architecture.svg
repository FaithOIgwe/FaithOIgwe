<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'SFMono-Regular', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#11122B"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg2)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>

  <text x="40" y="46" font-size="13" letter-spacing="3" fill="#67E8F9">TRADE-LEDGER-ANALYTICS · ARCHITECTURE</text>
  <text x="1160" y="46" font-size="12" text-anchor="end" fill="#64748B">one source · three paths</text>

  <!-- lane labels -->
  <g font-size="11" letter-spacing="2" fill="#64748B">
    <text x="410" y="108">BATCH</text>
    <text x="410" y="218">LAKEHOUSE</text>
    <text x="410" y="368">STREAMING</text>
  </g>

  <!-- paths -->
  <g fill="none" stroke-width="2">
    <path id="s1" d="M 160 150 L 240 220" stroke="#22D3EE" stroke-opacity="0.5"/>
    <path id="s2" d="M 160 290 L 240 220" stroke="#22D3EE" stroke-opacity="0.5"/>
    <path id="b1" d="M 330 220 C 360 220, 330 120, 390 120 L 560 120" stroke="#A78BFA" stroke-opacity="0.55"/>
    <path id="b2" d="M 700 120 L 860 120" stroke="#A78BFA" stroke-opacity="0.55"/>
    <path id="l1" d="M 330 220 C 420 220, 470 250, 560 250" stroke="#38BDF8" stroke-opacity="0.5"/>
    <path id="l2" d="M 700 250 L 860 250" stroke="#38BDF8" stroke-opacity="0.5"/>
    <path id="c1" d="M 330 220 C 360 220, 330 380, 390 380 L 560 380" stroke="#34D399" stroke-opacity="0.5"/>
    <path id="c2" d="M 700 380 L 860 380" stroke="#34D399" stroke-opacity="0.5"/>
  </g>

  <!-- airflow + CI tag over batch -->
  <g font-size="10">
    <rect x="600" y="70" width="64" height="20" rx="10" fill="none" stroke="#A78BFA" stroke-dasharray="3 3" stroke-opacity="0.7"/>
    <text x="632" y="84" text-anchor="middle" fill="#C4B5FD">Airflow</text>
    <rect x="674" y="70" width="96" height="20" rx="10" fill="none" stroke="#A78BFA" stroke-dasharray="3 3" stroke-opacity="0.7"/>
    <text x="722" y="84" text-anchor="middle" fill="#C4B5FD">GitHub Actions</text>
  </g>

  <!-- nodes -->
  <g font-size="13" text-anchor="middle">
    <!-- sources -->
    <rect x="40" y="128" width="120" height="44" rx="10" fill="#0F1B33" stroke="#22D3EE" stroke-opacity="0.75"/>
    <text x="100" y="147" fill="#A5F3FC">generator</text>
    <text x="100" y="163" font-size="10" fill="#64748B">orders · fills</text>
    <rect x="40" y="268" width="120" height="44" rx="10" fill="#0F1B33" stroke="#22D3EE" stroke-opacity="0.75"/>
    <text x="100" y="287" fill="#A5F3FC">Alpaca API</text>
    <text x="100" y="303" font-size="10" fill="#64748B">market prices</text>

    <!-- postgres -->
    <rect x="240" y="192" width="90" height="56" rx="12" fill="#101F3D" stroke="#38BDF8"/>
    <text x="285" y="216" fill="#E0F2FE" font-weight="700">Postgres</text>
    <text x="285" y="234" font-size="10" fill="#64748B">trading db</text>

    <!-- batch -->
    <rect x="560" y="98" width="140" height="44" rx="10" fill="#13183A" stroke="#A78BFA"/>
    <text x="630" y="117" fill="#E9D5FF" font-weight="700">dbt</text>
    <text x="630" y="133" font-size="10" fill="#94A3B8">stg → int → marts</text>
    <rect x="860" y="98" width="300" height="44" rx="10" fill="#13183A" stroke="#A78BFA" stroke-opacity="0.7"/>
    <text x="1010" y="117" fill="#E9D5FF">contracted marts + reporting</text>
    <text x="1010" y="133" font-size="10" fill="#94A3B8">fct_trades · fct_cash_ledger · snapshots</text>

    <!-- lakehouse -->
    <rect x="560" y="228" width="140" height="44" rx="10" fill="#0F1F35" stroke="#38BDF8"/>
    <text x="630" y="247" fill="#BAE6FD" font-weight="700">Spark</text>
    <text x="630" y="263" font-size="10" fill="#94A3B8">trade history</text>
    <rect x="860" y="228" width="300" height="44" rx="10" fill="#0F1F35" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="1010" y="247" fill="#BAE6FD">Iceberg on MinIO → Trino</text>
    <text x="1010" y="263" font-size="10" fill="#94A3B8">partition pruning · time travel</text>

    <!-- streaming -->
    <rect x="560" y="358" width="140" height="44" rx="10" fill="#0E2A24" stroke="#34D399"/>
    <text x="630" y="377" fill="#A7F3D0" font-weight="700">Debezium</text>
    <text x="630" y="393" font-size="10" fill="#94A3B8">WAL → Redpanda</text>
    <rect x="860" y="358" width="300" height="44" rx="10" fill="#0E2A24" stroke="#34D399" stroke-opacity="0.7"/>
    <text x="1010" y="377" fill="#A7F3D0">ClickHouse live views</text>
    <text x="1010" y="393" font-size="10" fill="#94A3B8">orders as they change</text>
  </g>

  <!-- packets -->
  <g>
    <g filter="url(#blur)">
      <circle r="5" fill="#22D3EE"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
      <circle r="5" fill="#22D3EE"><animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>
      <circle r="5" fill="#A78BFA"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
      <circle r="5" fill="#A78BFA"><animateMotion dur="1.4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
      <circle r="5" fill="#38BDF8"><animateMotion dur="2.6s" begin="-1s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="5" fill="#38BDF8"><animateMotion dur="1.6s" begin="-0.3s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="5" fill="#34D399"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
      <circle r="5" fill="#34D399"><animateMotion dur="1.1s" begin="-0.55s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
      <circle r="5" fill="#34D399"><animateMotion dur="0.9s" begin="-0.2s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    </g>
    <g fill="#FFFFFF">
      <circle r="2.2"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="1.4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="2.6s" begin="-1s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="1.6s" begin="-0.3s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="1.1s" begin="-0.55s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="0.9s" begin="-0.2s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    </g>
  </g>
</svg>
